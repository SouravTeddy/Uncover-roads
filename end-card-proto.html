<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>End Card Proto</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg:       #0f0d0c;
    --color-surface:  #1a1714;
    --color-surface2: #221e1b;
    --color-primary:  #d4a853;
    --color-text-1:   #f5f0ea;
    --color-text-2:   #c0b0a4;
    --color-text-3:   #a08d80;
    --color-text-4:   #726559;
    --color-border:   rgba(255,255,255,.09);
    --color-border-m: rgba(255,255,255,.16);
    --font-sans:      'DM Sans', sans-serif;
    --font-heading:   'Playfair Display', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #070605;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: var(--font-sans);
    gap: 48px;
    flex-wrap: wrap;
    padding: 48px;
  }

  .col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .label {
    font-size: 10px; color: var(--color-text-4);
    letter-spacing: 1.5px; text-transform: uppercase;
    font-family: var(--font-sans);
  }

  .phone {
    width: 375px; height: 812px;
    border-radius: 44px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.07);
    position: relative;
  }

  /* ── Shared card base ── */
  .card {
    width: 100%; height: 100%;
    background: var(--color-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 36px 96px;
    position: relative;
  }

  /* subtle texture lines at top */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 280px;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(212,168,83,.06) 0%, transparent 100%);
    pointer-events: none;
  }

  .check-ring {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(212,168,83,.3);
    background: rgba(212,168,83,.08);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }

  .check-ring svg {
    width: 20px; height: 20px;
    stroke: var(--color-primary);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .saved-tag {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--color-text-4);
    font-family: var(--font-sans);
    font-weight: 500;
    margin-bottom: 12px;
  }

  .city-name {
    font-family: var(--font-heading);
    font-size: 54px;
    font-weight: 700;
    font-style: italic;
    color: var(--color-text-1);
    text-align: center;
    line-height: 1.0;
    margin-bottom: 20px;
  }

  .trip-meta {
    font-size: 13px;
    color: var(--color-text-3);
    font-family: var(--font-sans);
    font-weight: 400;
    margin-bottom: 48px;
    letter-spacing: .2px;
  }

  /* ── Button variants ── */

  /* Gold filled */
  .btn-gold {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    background: var(--color-primary);
    border: none;
    border-radius: 14px;
    padding: 17px 20px;
    font-size: 14px; font-weight: 500;
    color: #1a1209;
    cursor: pointer; font-family: var(--font-sans);
    letter-spacing: .1px; text-decoration: none;
  }
  .btn-gold .map-icon { stroke: #1a1209; }

  /* Gold outline */
  .btn-outline {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    background: transparent;
    border: 1px solid rgba(212,168,83,.45);
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 14px; font-weight: 500;
    color: var(--color-primary);
    cursor: pointer; font-family: var(--font-sans);
    letter-spacing: .1px; text-decoration: none;
  }
  .btn-outline .map-icon { stroke: var(--color-primary); }

  /* Plain text link */
  .btn-text {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    background: none; border: none;
    font-size: 13px; font-weight: 500;
    color: var(--color-text-3);
    cursor: pointer; font-family: var(--font-sans);
    letter-spacing: .2px; text-decoration: none;
    padding: 8px 0;
  }
  .btn-text .map-icon { stroke: var(--color-text-3); }

  .map-icon {
    width: 16px; height: 16px;
    stroke-width: 1.6; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
  }

  .rule {
    width: 28px; height: 1px;
    background: rgba(212,168,83,.4);
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<!-- Gold filled -->
<div class="col">
  <div class="phone">
    <div class="card">
      <div class="check-ring">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#d4a853;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="saved-tag">Your trip is saved</p>
      <h1 class="city-name">Paris.</h1>
      <p class="trip-meta">3 days · 18 stops</p>
      <a class="btn-gold" href="#">
        <svg class="map-icon" viewBox="0 0 24 24">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
        Open full route in Maps
      </a>
    </div>
  </div>
  <p class="label">Gold filled</p>
</div>

<!-- Gold outline -->
<div class="col">
  <div class="phone">
    <div class="card">
      <div class="check-ring">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#d4a853;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="saved-tag">Your trip is saved</p>
      <h1 class="city-name">Paris.</h1>
      <p class="trip-meta">3 days · 18 stops</p>
      <a class="btn-outline" href="#">
        <svg class="map-icon" viewBox="0 0 24 24">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
        Open full route in Maps
      </a>
    </div>
  </div>
  <p class="label">Gold outline</p>
</div>

<!-- Text link -->
<div class="col">
  <div class="phone">
    <div class="card">
      <div class="check-ring">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#d4a853;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="saved-tag">Your trip is saved</p>
      <h1 class="city-name">Paris.</h1>
      <p class="trip-meta">3 days · 18 stops</p>
      <a class="btn-text" href="#">
        <svg class="map-icon" viewBox="0 0 24 24">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
        Open full route in Maps
      </a>
    </div>
  </div>
  <p class="label">Text link</p>
</div>

</body>
</html>
