<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stop Card Proto v3</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#111;overflow:hidden;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.ms{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1;display:inline-block;vertical-align:middle;white-space:nowrap;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0}

#frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a}
#phone{position:relative;width:390px;height:780px;max-width:100vw;max-height:100vh;overflow:hidden;border-radius:40px;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.09),0 32px 80px rgba(0,0,0,.9)}

/* ── Vertical reel ── */
#track{position:absolute;inset:0;will-change:transform;transition:transform .44s cubic-bezier(.22,1,.36,1)}
.card{position:absolute;left:0;right:0;overflow:hidden;background:#0a0c10}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.22) 0%,transparent 22%,transparent 44%,rgba(3,5,10,.48) 62%,rgba(3,5,10,.9) 100%)}

/* ── Top bar ── */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:18px 18px 0;pointer-events:none;z-index:5}
.day-col{display:flex;flex-direction:column;gap:1px}
.day-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.88);letter-spacing:.01em}
.day-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,.38)}
.stop-col{display:flex;align-items:center;gap:9px;pointer-events:auto}
.stop-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.38);letter-spacing:.04em;text-transform:uppercase}
.del-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);transition:opacity .1s}
.del-btn:active{opacity:.6}
.del-btn .ms{font-size:16px}

/* ── Panel ── */
.panel{position:absolute;left:0;right:0;bottom:0;background:rgba(7,9,15,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,.07);border-bottom:none;overflow:hidden;transition:height .4s cubic-bezier(.22,1,.36,1);will-change:height}
.panel-inner{display:flex;flex-direction:column;height:100%}

/* handle */
.handle{display:flex;justify-content:center;padding:10px 0 5px;flex-shrink:0}
.handle::after{content:'';width:36px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.15);display:block}

/* name */
.pname{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;line-height:1.22;color:rgba(255,255,255,.97);padding:0 18px 6px;flex-shrink:0}

/* description */
.pdesc{font-size:15px;line-height:1.6;color:rgba(255,255,255,.5);padding:0 18px 13px;flex-shrink:0;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.pdesc.clamp2{-webkit-line-clamp:2}

/* collapsed pills (2 max) */
.c-pills{display:flex;gap:8px;padding:0 18px 0;flex-shrink:0;flex-wrap:wrap}

/* next-leg footer */
.nextleg{display:flex;align-items:center;gap:6px;padding:10px 18px 10px;flex-shrink:0;font-size:13px;font-weight:500;color:rgba(255,255,255,.28)}
.nextleg .ms{font-size:14px}
.nextleg span.val{color:rgba(255,255,255,.55);font-weight:600}

/* accordion hint */
.coll-hint{display:flex;justify-content:center;padding:4px 0 12px;flex-shrink:0}
.coll-hint .ms{font-size:22px;color:rgba(255,255,255,.18)}

/* expanded content */
.exp{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 18px 0;display:none;scrollbar-width:none}
.exp::-webkit-scrollbar{display:none}

.sec-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:9px}
.sec-label.gold{color:rgba(212,168,83,.7)}
.reason{font-size:14.5px;line-height:1.68;color:rgba(255,255,255,.55);margin-bottom:16px}
.div{height:1px;background:rgba(255,255,255,.07);margin:4px 0 16px}

/* pills grid */
.pgrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}

/* pill base — unified color, two states */
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;-webkit-tap-highlight-color:transparent;position:relative;user-select:none}
/* clickable pill — more prominent, has cursor + active state */
.pill.click{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.88);cursor:pointer;transition:background .12s}
.pill.click:active{background:rgba(255,255,255,.18)}
/* static pill — dimmer, no pointer */
.pill.static{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.42);cursor:default}
.pill .ms{font-size:15px}
.pill .chev{font-size:12px;opacity:.5;margin-left:1px}

/* hours */
.hours-row{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:14px}
.hours-row .ms{font-size:16px;color:rgba(255,255,255,.28)}
.hours-text{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.5)}
.hours-text b{font-weight:700}
.open{color:#5de89a}.closed{color:#e8615a}

/* reco section */
.reco-sec{margin-bottom:14px}
.reco-teaser{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:background .15s}
.reco-teaser:active{background:rgba(255,255,255,.08)}
.reco-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.reco-info{flex:1;min-width:0}
.reco-title{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75)}
.reco-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px}
.reco-arr{font-size:15px;color:rgba(255,255,255,.25)}
/* embedded reco list */
.reco-place{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:7px}
.reco-rank{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.reco-pname{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
.reco-pmeta{font-size:10.5px;color:rgba(255,255,255,.38);margin-top:1px}
.reco-reason{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;margin-top:4px}

/* explore CTA */
.cta-wrap{flex-shrink:0;padding:14px 18px 28px;display:none}
.cta-btn{width:100%;height:50px;border-radius:14px;background:linear-gradient(135deg,#D4A853,#c4903d);font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .12s}
.cta-btn:active{opacity:.8}
.cta-btn .ms{font-size:17px}

/* ── Pill detail sheet ── */
#psheet-bg{position:absolute;inset:0;z-index:20;display:none;background:transparent}
#psheet{position:absolute;bottom:0;left:0;right:0;z-index:21;background:rgba(8,10,17,.96);backdrop-filter:blur(24px);border-radius:22px 22px 0 0;border:1px solid rgba(255,255,255,.08);border-bottom:none;padding:10px 18px 36px;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1)}
#psheet.open{transform:translateY(0)}
.ps-handle{display:flex;justify-content:center;padding:4px 0 12px}
.ps-handle::after{content:'';width:36px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.15);display:block}
.ps-title{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-bottom:7px}
.ps-body{font-size:14px;line-height:1.65;color:rgba(255,255,255,.82)}

/* ── Option label (proto-only) ── */
.opt-label{position:absolute;top:72px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.22);pointer-events:none;white-space:nowrap;z-index:6}

/* ── Swipe hint ── */
.swipe-hint{position:absolute;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:600;letter-spacing:.05em;color:rgba(255,255,255,.2);white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:4px;z-index:6;opacity:0;animation:fh 1.4s 1.8s ease forwards}
.swipe-hint .ms{font-size:14px;animation:bob 2s ease-in-out infinite}
@keyframes fh{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
</style>
</head>
<body>
<div id="dbg" style="display:none"></div>
<div id="frame">
  <div id="phone">
    <div id="track"></div>
    <div id="psheet-bg"></div>
    <div id="psheet">
      <div class="ps-handle"></div>
      <div class="ps-title" id="ps-title"></div>
      <div class="ps-body" id="ps-body"></div>
    </div>
  </div>
</div>

// ── state ──────────────────────────────────────────────────────────────────
let cur = 0, expanded = false;
const phone = document.getElementById('phone');
const PH = () => phone.offsetHeight;
const PW = () => phone.offsetWidth;
const COLL = () => Math.round(PH() * 0.40);
const EXPD = () => Math.round(PH() * 0.70);

// ── build ──────────────────────────────────────────────────────────────────
function build() {
  const track = document.getElementById('track');
  track.innerHTML = '';
  const ph = PH(), pw = PW();

  STOPS.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.id = `c${i}`;
    div.style.cssText = `top:${i*ph}px;width:${pw}px;height:${ph}px`;

    // reco section HTML
    let recoHtml = '';
    if (s.reco) {
      if (s.recoVariant === 'A') {
        // Option A: teaser row with arrow
        recoHtml = `
          <div class="div"></div>
          <div class="sec-label">Nearby suggestion</div>
          <div class="reco-teaser" onclick="event.stopPropagation()">
            <div class="reco-dot" style="background:${s.reco.triggerColor}"></div>
            <div class="reco-info">
              <div class="reco-title">${s.reco.label}</div>
              <div class="reco-sub">${s.reco.consequence}</div>
            </div>
            <span class="ms reco-arr">chevron_right</span>
          </div>`;
      } else {
        // Option B: embedded place list
        recoHtml = `
          <div class="div"></div>
          <div class="sec-label" style="color:${s.reco.triggerColor};opacity:.8">${s.reco.label}</div>
          <div style="font-size:12px;color:rgba(255,255,255,.35);margin-bottom:10px">${s.reco.consequence}</div>
          ${s.reco.places.map(p=>`
            <div class="reco-place">
              <div class="reco-rank" style="background:${p.color?`${p.color}20`:'rgba(255,255,255,.06)'};border:1px solid ${p.color?`${p.color}40`:'rgba(255,255,255,.1)'};color:${p.color||'rgba(255,255,255,.4)'}">
                ${p.rank}
              </div>
              <div style="flex:1;min-width:0">
                <div class="reco-pname">${p.name}</div>
                <div class="reco-pmeta">${p.meta}</div>
                ${p.reason?`<div class="reco-reason" style="background:${p.color?`${p.color}18`:'rgba(255,255,255,.06)'};border:1px solid ${p.color?`${p.color}30`:'rgba(255,255,255,.08)'};color:${p.color||'rgba(255,255,255,.4)'}">${p.reason}</div>`:''}
              </div>
              <span class="ms" style="font-size:14px;color:rgba(255,255,255,.18)">map</span>
            </div>`).join('')}`;
      }
    }

    // option label (proto-only annotation)
    const optLabel = s.reco
      ? `<div class="opt-label">Reco: Option ${s.recoVariant === 'A' ? 'A — teaser' : 'B — embedded'}</div>`
      : '';

    // swipe hint on first card
    const hint = i === 0
      ? `<div class="swipe-hint" style="bottom:${COLL()+18}px"><span class="ms">swipe_up</span>Swipe photo to navigate</div>`
      : '';

    div.innerHTML = `
      <img src="${s.photo}" alt="" draggable="false">
      <div class="vignette"></div>
      ${optLabel}
      <div class="topbar">
        <div class="day-col">
          <span class="day-label">Day ${s.day} of ${s.dayTotal}</span>
          <span class="day-sub">${s.date}</span>
        </div>
        <div class="stop-col">
          <span class="stop-label">Stop ${s.stop} of ${s.stopTotal}</span>
          <button class="del-btn"><span class="ms">delete_outline</span></button>
        </div>
      </div>
      ${hint}
      <div class="panel" id="pan${i}" style="height:${COLL()}px">
        <div class="panel-inner">
          <div class="handle" id="hdl${i}"></div>
          <div class="pname">${s.name}</div>
          <div class="pdesc clamp2" id="dsc${i}">${s.desc}</div>

          <!-- collapsed: 2 pills -->
          <div class="c-pills" id="cp${i}">
            ${makePill(s.pill1, i, -1, true)}
            ${makePill(s.pill2, i, -2, true)}
          </div>

          <!-- next-leg footer (collapsed) -->
          <div class="nextleg" id="nl${i}">
            <span class="ms">${s.nextLeg.icon}</span>
            Then <span class="val">${s.nextLeg.dur}</span> to ${s.nextLeg.dest}
            <span class="ms" style="font-size:13px;margin-left:2px">arrow_forward</span>
          </div>

          <!-- accordion expand hint -->
          <div class="coll-hint" id="ch${i}">
            <span class="ms">keyboard_arrow_down</span>
          </div>

          <!-- expanded zone -->
          <div class="exp" id="exp${i}">
            <div class="sec-label gold" style="display:flex;align-items:center;gap:4px">
              <span class="ms" style="font-size:12px">auto_awesome</span>Why this stop
            </div>
            <div class="reason">${s.reason}</div>
            <div class="div"></div>
            <div class="sec-label">At a glance</div>
            <div class="pgrid">
              ${s.pills.map((p, pi) => makePill(p, i, pi)).join('')}
            </div>
            <div class="hours-row">
              <span class="ms">schedule</span>
              <span class="hours-text"><b class="${s.hours.open?'open':'closed'}">${s.hours.open?'Open':'Closed'}</b> · ${s.hours.text}</span>
            </div>
            ${recoHtml}
            <div style="height:16px"></div>
          </div>

          <!-- explore CTA -->
          <div class="cta-wrap" id="cta${i}">
            <button class="cta-btn"><span class="ms">explore</span>Explore nearby</button>
          </div>
        </div>
      </div>
    `;
    track.appendChild(div);
  });

  // no tap handler — swipe only

  posTrack(false);

  // fit collapsed height to actual content
  requestAnimationFrame(() => {
    STOPS.forEach((_, i) => {
      if (i === cur && expanded) return;
      const pan = document.getElementById(`pan${i}`);
      pan.style.height = 'auto';
      const h = pan.scrollHeight;
      pan.style.height = h + 'px';
    });
  });
}

function makePill(p, cardIdx, pillIdx, inColl=false) {
  const clickable = p.detail !== null;
  const cls = clickable ? 'click' : 'static';
  const chev = clickable ? `<span class="ms chev">expand_more</span>` : '';
  const dataAttrs = clickable
    ? `data-card="${cardIdx}" data-coll="${inColl?1:0}" data-title="${encodeURIComponent(p.detail.title)}" data-body="${encodeURIComponent(p.detail.body)}"`
    : '';
  return `<div class="pill ${cls}" ${dataAttrs} onclick="pillClick(this,event)">
    <span class="ms">${p.icon}</span>${p.label}${chev}
  </div>`;
}

// ── pill detail ────────────────────────────────────────────────────────────
let activePillEl = null;

function openPillSheet(title, body, triggerEl) {
  if (activePillEl) activePillEl.querySelector('.chev').textContent = 'expand_more';
  activePillEl = triggerEl;
  triggerEl.querySelector('.chev').textContent = 'expand_less';
  document.getElementById('ps-title').textContent = decodeURIComponent(title);
  document.getElementById('ps-body').textContent  = decodeURIComponent(body);
  document.getElementById('psheet').classList.add('open');
  document.getElementById('psheet-bg').style.display = 'block';
}
function pillClick(el, e) {
  e.stopPropagation();
  const title = el.dataset.title;
  const body  = el.dataset.body;
  if (!title) return;
  if (el.dataset.coll === '1' && !expanded) {
    doExpand(cur);
    setTimeout(() => openPillSheet(title, body, el), 420);
  } else {
    openPillSheet(title, body, el);
  }
}
document.getElementById('psheet-bg').addEventListener('click', closePill);
document.getElementById('psheet').addEventListener('click', closePill);
function closePill() {
  if (activePillEl) { activePillEl.querySelector('.chev').textContent = 'expand_more'; activePillEl = null; }
  document.getElementById('psheet').classList.remove('open');
  document.getElementById('psheet-bg').style.display = 'none';
}

// ── expand / collapse ──────────────────────────────────────────────────────
function doExpand(i) {
  expanded = true;
  const pan = document.getElementById(`pan${i}`);
  const dsc = document.getElementById(`dsc${i}`);
  const cps = document.getElementById(`cp${i}`);
  const nl  = document.getElementById(`nl${i}`);
  const ch  = document.getElementById(`ch${i}`);
  const exp = document.getElementById(`exp${i}`);
  const cta = document.getElementById(`cta${i}`);
  pan.style.height = EXPD() + 'px';
  dsc.classList.remove('clamp2');
  cps.style.display = 'none';
  nl.style.display  = 'none';
  ch.style.display  = 'none';
  exp.style.display = 'block';
  cta.style.display = 'block';
}
function doCollapse(i) {
  closePill(); // close pill sheet first if open
  expanded = false;
  const pan = document.getElementById(`pan${i}`);
  const dsc = document.getElementById(`dsc${i}`);
  const cps = document.getElementById(`cp${i}`);
  const nl  = document.getElementById(`nl${i}`);
  const ch  = document.getElementById(`ch${i}`);
  const exp = document.getElementById(`exp${i}`);
  const cta = document.getElementById(`cta${i}`);
  dsc.classList.add('clamp2');
  cps.style.display = '';
  nl.style.display  = '';
  ch.style.display  = '';
  exp.style.display = 'none';
  cta.style.display = 'none';
  exp.scrollTop = 0;
  pan.style.height = 'auto';
  requestAnimationFrame(() => {
    pan.style.transition = 'height .4s cubic-bezier(.22,1,.36,1)';
    pan.style.height = pan.scrollHeight + 'px';
  });
}

// ── navigation ─────────────────────────────────────────────────────────────
function navigate(dir) {
  const next = cur + dir;
  if (next < 0 || next >= STOPS.length) return;
  if (expanded) doCollapse(cur);
  cur = next;
  posTrack(true);
}
function posTrack(anim) {
  const track = document.getElementById('track');
  track.style.transition = anim ? 'transform .44s cubic-bezier(.22,1,.36,1)' : 'none';
  track.style.transform  = `translateY(${-cur * PH()}px)`;
}

// ── drag detection ─────────────────────────────────────────────────────────
let sx, sy, sPanel;

function onDown(cx,cy,target){
  sx=cx; sy=cy; sPanel=!!target.closest('.panel');
}
function onUp(cx,cy){
  if(sx===undefined) return;
  const dx=cx-sx, dy=cy-sy;
  sx=sy=undefined;
  if(Math.abs(dx)>Math.abs(dy)||Math.abs(dy)<28) return;
  if(sPanel){
    if(dy<0&&!expanded) doExpand(cur);
    if(dy>0&&expanded)  doCollapse(cur);
  } else {
    if(expanded){
      if(dy>0){ doCollapse(cur); setTimeout(()=>navigate(-1),440); } // collapse then go back
    } else {
      if(dy<0) navigate(1);
      if(dy>0) navigate(-1);
    }
  }
}

// pointer events (desktop + mobile)
document.addEventListener('pointerdown', e=>{ if(phone.contains(e.target)) onDown(e.clientX,e.clientY,e.target); });
document.addEventListener('pointerup',   e=>{ onUp(e.clientX,e.clientY); });

// touch events fallback
document.addEventListener('touchstart', e=>{ if(phone.contains(e.target)){ const t=e.touches[0]; onDown(t.clientX,t.clientY,e.target); }},{passive:true});
document.addEventListener('touchend',   e=>{ const t=e.changedTouches[0]; onUp(t.clientX,t.clientY); },{passive:true});

// keyboard: arrows navigate cards, space toggles expand
document.addEventListener('keydown', e=>{
  if(document.getElementById('psheet').classList.contains('open')){closePill();return}
  if(e.key==='ArrowDown'){ e.preventDefault(); expanded?doCollapse(cur):navigate(1); }
  if(e.key==='ArrowUp'){   e.preventDefault(); expanded?doCollapse(cur):navigate(-1); }
  if(e.key===' '){         e.preventDefault(); expanded?doCollapse(cur):doExpand(cur); }
  if(e.key==='Escape')     doCollapse(cur);
});

build();
window.addEventListener('resize', ()=>{ if(expanded)doCollapse(cur); build(); });
</script>
</body>
