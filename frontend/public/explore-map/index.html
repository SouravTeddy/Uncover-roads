<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore Map — Areas of Interest</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background:
        radial-gradient(ellipse 60% 40% at 30% 20%, rgba(212,168,83,.06), transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(59,107,206,.06), transparent 60%),
        #07070a;
      font-family: 'DM Sans', sans-serif; color: #f2ede6; overflow-x: hidden;
    }
    .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px 44px; gap: 20px; }

    .phone {
      width: 390px; height: 844px; border-radius: 54px; background: #000; position: relative;
      box-shadow: 0 60px 120px rgba(0,0,0,.6), 0 20px 40px rgba(0,0,0,.4), 0 0 0 8px #18181c, 0 0 0 9px rgba(255,255,255,.04);
      padding: 9px; flex-shrink: 0;
    }
    .phone .screen { width: 100%; height: 100%; border-radius: 46px; overflow: hidden; position: relative; background: #0b0e15; }
    .phone .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 118px; height: 34px; border-radius: 22px; background: #000; z-index: 1000; pointer-events: none; }
    .phone .indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.5); z-index: 1000; pointer-events: none; }
    .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 16px 30px 0; font-family: -apple-system, "SF Pro", system-ui; font-weight: 600; font-size: 15px; color: #fff; z-index: 900; pointer-events: none; }
    .statusbar .sig { display: flex; gap: 4px; align-items: flex-end; }
    .statusbar .sig i { width: 3px; border-radius: 1px; background: #fff; display: block; }

    .caption { max-width: 390px; text-align: center; color: rgba(242,237,230,.5); font-family: 'DM Sans', sans-serif; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; }

    @keyframes pinPop    { 0% { transform: scale(0); opacity: 0 } 60% { transform: scale(1.15); opacity: 1 } 100% { transform: scale(1) } }
    @keyframes pinDrop   { 0% { transform: translateY(-14px) scale(.4); opacity: 0 } 60% { transform: translateY(0) scale(1.08); opacity: 1 } 100% { transform: translateY(0) scale(1) } }
    @keyframes fadeIn    { from { opacity: 0 } to { opacity: 1 } }
    @keyframes stripIn   { from { opacity: 0; transform: translate(-50%, 12px) } to { opacity: 1; transform: translate(-50%, 0) } }
    @keyframes bannerIn  { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes pillPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(232,97,90,.5) } 50% { box-shadow: 0 0 0 7px rgba(232,97,90,0) } }
    @keyframes xBounce   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) scale(1.12) } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <script type="text/babel" src="explore-icons.jsx"></script>
  <script type="text/babel" src="explore-data.jsx"></script>

  <!-- explore-map.jsx with Header stripped -->
  <script type="text/babel" src="explore-map-noheader.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState } = React;
    const DEMOS = [
      { id: 'areas', label: 'Areas of interest', hint: 'Zoom in → area pills appear. Tap a pill to drop its spots.' },
      { id: 'empty', label: 'Empty area',        hint: 'Filter pill active. Pan left toward the park — pill turns red.' },
    ];
    function App() {
      const [demo, setDemo] = useState('areas');
      const meta = DEMOS.find(d => d.id === demo);
      return (
        <div className="stage">
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12 }}>
            <div style={{ display: 'flex', gap: 4, padding: 4, borderRadius: 999, background: 'rgba(255,255,255,.05)', border: '1px solid rgba(255,255,255,.08)' }}>
              {DEMOS.map((d, i) => {
                const a = d.id === demo;
                return (
                  <button key={d.id} onClick={() => setDemo(d.id)} style={{ border: 'none', cursor: 'pointer', padding: '9px 18px', borderRadius: 999,
                    fontFamily: "'DM Sans',sans-serif", fontSize: 12.5, fontWeight: 700, letterSpacing: '.02em',
                    background: a ? 'rgba(212,168,83,.16)' : 'transparent', color: a ? '#d4a853' : 'rgba(242,237,230,.55)',
                    boxShadow: a ? 'inset 0 0 0 1px rgba(212,168,83,.5)' : 'none' }}>
                    <span style={{ opacity: .6, marginRight: 6 }}>{i + 1}</span>{d.label}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize: 13, color: 'rgba(242,237,230,.55)', textAlign: 'center', maxWidth: 340 }}>{meta.hint}</div>
          </div>

          <div className="phone">
            <div className="screen">
              <ExploreMapNoHeader key={demo} demo={demo} />
              <div className="statusbar">
                <span>9:41</span>
                <div style={{ display: 'flex', gap: 7, alignItems: 'center' }}>
                  <div className="sig">
                    <i style={{ height: 5 }}></i><i style={{ height: 8 }}></i><i style={{ height: 11 }}></i><i style={{ height: 14, opacity: .4 }}></i>
                  </div>
                  <div style={{ width: 22, height: 11, border: '1.5px solid rgba(255,255,255,.6)', borderRadius: 3, position: 'relative' }}>
                    <div style={{ position: 'absolute', inset: 1.5, width: '72%', background: '#fff', borderRadius: 1 }}></div>
                  </div>
                </div>
              </div>
              <div className="island"></div>
              <div className="indicator"></div>
            </div>
          </div>

          <div className="caption" style={{ opacity: .5 }}>Drag to pan · scroll or +/− to zoom</div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
